<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Online</title>
    <link rel="stylesheet" href="style/tienda_style/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="menu">
            <a href="index.html">
                <img src="./assets/logo.png" alt="Logo" class="logo-img">
            </a>
        </div>
    </header>

    <section class="inicio" id="inicio">
        <div class="filtros">
            <h2>Filtros</h2>
            <div class="filter-container">
                <div class="filter-group">
                    <label for="brand">Categoría</label>
                    <select id="brand">
                        <option value=" ">Todos</option>
                        <option value="cosm_alt">Cosmética alternativa</option>
                        <option value="cosm_inf">Cosmética infantil</option>
                        <option value="sstilo">Línea Sstilo</option>
                        <option value="vasos_termicos">Vasos térmicos</option>
                        <option value="jugueteria">Juguetería</option>
                        <option value="bazar">Bazar</option>
                    </select>
                </div>
                <button id="apply-filters">Aplicar</button>
            </div>
        </div>
        <div class="tienda">
            <div class="sort-container">
                <label for="sort-by">Ordenar por:</label>
                <select id="sort-by">
                  <option value=" "> </option>
                  <!--<option value="price-low-high">Precio: Menor a Mayor</option>
                  <option value="price-high-low">Precio: Mayor a Menor</option> -->
                  <option value="newest">Novedades</option>
                </select>
            </div>
            <div class="products-container">  
                <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
                <script src="adding-products.js"></script>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p>Diseño y desarrollo web por Camila Figueroa Cillo.</p>
    </footer>
    
</body>
</html>
